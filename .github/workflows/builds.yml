# Builds ready to play packages for Windows, macOS and Linux and publishes them as the "latest" release

name: Builds

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: 1.81.0
  # The updater would replace this build with the official one
  CMAKE_FLAGS: -DRTTR_BUILD_UPDATER=OFF -DBUILD_TESTING=OFF

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64, arch: x64 }
          - { platform: Win32, arch: x86 }
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Install boost
        uses: MarkusJx/install-boost@8ba8b2fac59ef3d91a838bb4aa53ceabd33d1aa3 # v2.5.1
        id: install-boost
        with:
          boost_version: ${{ env.BOOST_VERSION }}
          platform_version: 2022
          toolset: msvc
      - name: Configure
        env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        shell: cmd
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.platform }} %CMAKE_FLAGS%
          -DRTTR_INCLUDE_DEVTOOLS=ON
          -DCMAKE_EXE_LINKER_FLAGS=/LTCG -DCMAKE_SHARED_LINKER_FLAGS=/LTCG
          -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%\package\s25rttr
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Install
        run: cmake --install build --config Release
      - name: Add DLLs
        shell: pwsh
        run: |
          $dest = "package\s25rttr"
          # Libraries copied next to the executable during the build (SDL2, curl, ...)
          Copy-Item build\Release\*.dll $dest
          # MSVC runtime
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -property installationPath
          $crtDir = Get-ChildItem "$vsPath\VC\Redist\MSVC\*\${{ matrix.arch }}\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if(-not $crtDir) { throw "MSVC runtime not found" }
          Copy-Item "$($crtDir.FullName)\*.dll" $dest
          Get-ChildItem $dest -Recurse -Include *.exe,*.dll | ForEach-Object { $_.FullName }
      - name: Package
        shell: bash
        run: |
          cd package
          7z a -tzip ../s25rttr_windows_${{ matrix.arch }}.zip s25rttr
      - uses: actions/upload-artifact@v7
        with:
          name: s25rttr_windows_${{ matrix.arch }}
          path: s25rttr_windows_${{ matrix.arch }}.zip
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install boost sdl2 sdl2_mixer gettext miniupnpc
          BOOST_ROOT=$(find "$HOMEBREW_CELLAR/boost/"* -maxdepth 0 -type d | tail -n1)
          [[ -n "$BOOST_ROOT" ]] || exit 1
          echo "BOOST_ROOT=${BOOST_ROOT}" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${CMAKE_FLAGS}
          -DRTTR_BUNDLE=ON -DRTTR_INCLUDE_DEVTOOLS=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/package"
      - name: Build
        run: cmake --build build --parallel "$(sysctl -n hw.logicalcpu)"
      - name: Install
        # Creates the app bundle including all libraries
        run: cmake --install build
      - name: Sign
        # Apple Silicon only runs signed code, so sign ad-hoc
        run: |
          codesign --force --deep --sign - package/RTTR.app
          codesign --verify --deep --verbose package/RTTR.app
          find package/RTTR.app -type f -perm +111 -exec file {} \; | grep Mach-O
      - name: Package
        run: ditto -c -k --keepParent package/RTTR.app s25rttr_macos_arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: s25rttr_macos_arm64
          path: s25rttr_macos_arm64.zip
          if-no-files-found: error

  linux:
    name: Linux x86_64
    # Oldest available runner for a low glibc requirement
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 -y -q --no-install-suggests --no-install-recommends install \
            gettext libsdl2-dev libsdl2-mixer-dev libbz2-dev libminiupnpc-dev liblua5.2-dev libboost-all-dev patchelf
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${CMAKE_FLAGS}
          -DRTTR_BUNDLE=ON -DRTTR_INCLUDE_DEVTOOLS=ON
          -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/package/s25rttr"
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Install
        run: cmake --install build
      - name: Bundle libraries
        # Copy all libraries except the ones which are part of every system or must match the system (graphics, sound)
        run: |
          set -euo pipefail
          cd package/s25rttr
          mkdir -p lib
          exclude='^(ld-linux.*|linux-vdso.*|(libc|libm|libdl|libpthread|librt|libresolv|libutil|libstdc\+\+|libgcc_s|libz|libasound|libdbus-1|libsystemd|libudev)\.so.*|(libGL|libEGL|libOpenGL|libdrm|libgbm|libX|libxcb|libwayland|libxkbcommon|libpulse|libjack).*)$'
          elfs=$(find . -type f \( -perm -u+x -o -name '*.so*' \) -exec sh -c 'file -b "$1" | grep -q ELF' _ {} \; -print)
          for elf in $elfs; do
            ldd "$elf" | awk '/=> \//{print $1, $3}'
          done | sort -u | while read -r name path; do
            if ! [[ "$name" =~ $exclude ]] && [[ ! -e "lib/$name" ]]; then
              cp -vL "$path" "lib/$name"
            fi
          done
          # Let the bundled libraries and the drivers find the bundled libraries
          find lib -maxdepth 1 -name '*.so*' -type f -exec patchelf --set-rpath '$ORIGIN' {} \;
          find lib/s25rttr/driver -name '*.so' -type f -exec patchelf --set-rpath '$ORIGIN/../../..' {} \;
          # Verify that everything is found
          missing=0
          for elf in $elfs $(find lib -maxdepth 1 -name '*.so*' -type f); do
            if ldd "$elf" | grep 'not found'; then echo "in $elf"; missing=1; fi
          done
          [[ $missing -eq 0 ]]
          find . -type f | sort
      - name: Package
        run: |
          cd package
          tar -czf ../s25rttr_linux_x86_64.tar.gz s25rttr
      - uses: actions/upload-artifact@v7
        with:
          name: s25rttr_linux_x86_64
          path: s25rttr_linux_x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows, macos, linux]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Move tag to current commit
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Get commit info
        run: |
          {
            echo "COMMIT_INFO<<EOF"
            git log -1 --format='%h %s'
            echo "EOF"
          } >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Build of the latest commit on master: ${{ env.COMMIT_INFO }}

            Copy the folders `DATA` and `GFX` from The Settlers II Gold:
            - Windows: next to `s25client.exe` (where the file `put your S2-Installation in here` is) and start `s25client.exe`
            - macOS: start `RTTR.app`, it tells you where to put them.
              The app is not signed by Apple: run `xattr -dr com.apple.quarantine RTTR.app` once after unpacking.
            - Linux: into `s25rttr/share/s25rttr/S2` and start `s25rttr/bin/rttr.sh`
          files: |
            packages/*.zip
            packages/*.tar.gz
          fail_on_unmatched_files: true
